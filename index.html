<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090b11"><title>Fire TV Remote</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><header><a class="brand" href="#"><span class="brand-icon">✦</span><span>FIRE<span class="dim">REMOTE</span></span></a><div class="live"><i id="dot"></i><span id="status">Not connected</span></div></header>
<section class="intro"><h1>Remote</h1></section>
<section class="connect card"><div class="card-title"><div><h2>Connect device</h2></div><span class="wifi">⌁</span></div><p>Fire TV IP address</p><form id="connectForm"><div class="input-row"><input id="address" placeholder="192.168.1.25:5555" autocomplete="off" aria-label="Fire TV IP address"><button class="connect-btn" type="submit" id="connectBtn">Connect <span>↗</span></button></div></form><div class="hint">Find it on Fire TV: <b>Settings → My Fire TV → About → Network</b></div><div class="error" id="error"></div></section>
<section class="remote card" id="remote"><div class="remote-top"><span class="remote-label">FIRE TV</span><button class="disconnect" id="disconnect">Disconnect</button></div><div class="controls"><div class="dpad"><button class="key up" data-key="up" aria-label="Up">⌃</button><button class="key left" data-key="left" aria-label="Left">‹</button><button class="key select" data-key="select">OK</button><button class="key right" data-key="right" aria-label="Right">›</button><button class="key down" data-key="down" aria-label="Down">⌄</button><div class="center-ring"></div></div><div class="side-controls"><button class="round back" data-key="back"><span>↶</span><small>BACK</small></button><button class="round home" data-key="home"><span>⌂</span><small>HOME</small></button><button class="round menu" data-key="menu"><span>☰</span><small>MENU</small></button></div></div><div class="playback"><button data-key="rewind" aria-label="Rewind">«</button><button class="play" data-key="playpause" aria-label="Play or pause">Ⅱ</button><button data-key="forward" aria-label="Fast forward">»</button></div><div class="volume"><button data-key="volumedown" aria-label="Volume down">−</button><div><span>VOLUME</span><i><b></b></i></div><button data-key="volumeup" aria-label="Volume up">+</button><button class="mute" data-key="mute">◖<small>MUTE</small></button></div><form class="search" id="textForm"><span>⌕</span><input id="text" placeholder="Type to search on your TV…" maxlength="200"><button aria-label="Send text">↵</button></form></section>
<footer><span>FIRE TV REMOTE</span></footer></main><script src="/app.js"></script></body></html>
